<section class="card bg-base-100 border border-base-300 shadow-sm"><div class="card-body"><div class="flex items-center justify-between"><h2 class="card-title">Edit issue</h2><button class="btn btn-sm btn-ghost" type="button" (click)="cancelled.emit()">Cancel</button></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-3"><label class="form-control md:col-span-2"><span class="label-text">Title</span><input class="input input-bordered" [(ngModel)]="title" maxlength="200"></label><label class="form-control md:col-span-2"><span class="label-text">Description</span><textarea class="textarea textarea-bordered min-h-32" [(ngModel)]="description"></textarea></label><label class="form-control"><span class="label-text">Type</span><select class="select select-bordered" [(ngModel)]="type"><option *ngFor="let value of types" [ngValue]="value">{{ value }}</option></select></label><label class="form-control"><span class="label-text">Priority</span><select class="select select-bordered" [(ngModel)]="priority"><option *ngFor="let value of priorities" [ngValue]="value">{{ value }}</option></select></label><label class="form-control"><span class="label-text">Story points</span><input class="input input-bordered" type="number" min="0" max="100" [(ngModel)]="storyPoints"></label><label class="form-control"><span class="label-text">Assignee</span><select class="select select-bordered" [(ngModel)]="assigneeId"><option [ngValue]="undefined">Unassigned</option><option *ngFor="let user of users" [ngValue]="user.id">{{ user.name }}</option></select></label></div><div class="card-actions justify-end mt-4"><button class="btn" type="button" (click)="cancelled.emit()">Cancel</button><button class="btn btn-primary" type="button" [disabled]="saving || !title.trim() || storyPoints < 0" (click)="save()"><span *ngIf="saving" class="loading loading-spinner loading-xs"></span>Save changes</button></div></div></section>
