<div class="p-4 lg:p-8 max-w-6xl mx-auto"><div class="mb-7"><div class="breadcrumbs text-sm"><ul><li>Project</li><li>Backlog</li></ul></div><h1 class="text-3xl font-bold mt-2">Backlog</h1><p class="text-base-content/60">Prioritize upcoming work before moving it into an active sprint.</p></div><div class="card bg-base-100 shadow-sm"><div class="card-body p-0"><div class="p-5 border-b border-base-300 flex justify-between"><h2 class="font-semibold">Product backlog</h2><span class="badge badge-outline">{{ issues().length }} items</span></div><div *ngFor="let issue of issues(); let i = index" class="flex items-center gap-4 p-4 border-b border-base-300 hover:bg-base-200"><span class="text-sm w-8 text-base-content/40">{{ i + 1 }}</span><div class="flex-1 min-w-0"><a [routerLink]="['/issues', issue.id]" class="font-medium link link-hover">{{ issue.title }}</a><div class="text-xs font-mono text-base-content/50">{{ issue.key }} · {{ issue.type }}</div></div><span class="badge badge-sm">{{ issue.priority }}</span><span class="badge badge-outline badge-sm">{{ issue.status }}</span></div><div *ngIf="issues().length===0" class="p-12 text-center text-base-content/50">The backlog is empty.</div></div></div></div>
