<main class="min-h-screen grid place-items-center bg-base-200 p-4">
  <section class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body gap-5">
      <div><div class="text-2xl font-black">JIRA<span class="text-primary">Clone</span></div><h1 class="text-xl font-bold mt-6">Sign in</h1><p class="text-sm text-base-content/60">Access your Agile workspace.</p></div>
      <div *ngIf="error()" class="alert alert-error text-sm">{{ error() }}</div>
      <label class="form-control"><span class="label-text mb-2">Email</span><input class="input input-bordered" type="email" [(ngModel)]="email" /></label>
      <label class="form-control"><span class="label-text mb-2">Password</span><input class="input input-bordered" type="password" [(ngModel)]="password" (keyup.enter)="submit()" /></label>
      <button class="btn btn-primary w-full" [disabled]="submitting()" (click)="submit()"><span *ngIf="submitting()" class="loading loading-spinner loading-sm"></span>{{ submitting() ? 'Signing in...' : 'Sign in' }}</button>
      <div class="divider">DEMO</div>
      <div class="text-xs text-base-content/60">Email: darshan@example.com<br />Password: demo123</div>
    </div>
  </section>
</main>
