<div class="p-4 lg:p-8 max-w-6xl mx-auto"><div class="mb-7"><div class="breadcrumbs text-sm"><ul><li>Project</li><li>Sprints</li></ul></div><h1 class="text-3xl font-bold mt-2">Sprint</h1><p class="text-base-content/60">Current iteration delivery progress.</p></div><section class="card bg-base-100 shadow-sm"><div class="card-body"><div class="flex flex-wrap justify-between gap-3"><div><h2 class="card-title">Sprint 1 · Foundation</h2><p class="text-sm text-base-content/50">Angular + .NET 8 Jira vertical slice</p></div><span class="badge badge-primary">Active</span></div><div class="mt-7"><div class="flex justify-between text-sm mb-2"><span>Completion</span><strong>{{ progress() }}%</strong></div><progress class="progress progress-primary w-full" [value]="progress()" max="100"></progress></div><div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-6"><div class="stat bg-base-200 rounded-box"><div class="stat-title">Committed</div><div class="stat-value text-2xl">{{ issues().length }}</div></div><div class="stat bg-base-200 rounded-box"><div class="stat-title">Done</div><div class="stat-value text-2xl text-success">{{ done() }}</div></div><div class="stat bg-base-200 rounded-box"><div class="stat-title">Remaining</div><div class="stat-value text-2xl">{{ issues().length - done() }}</div></div></div></div></section></div>
