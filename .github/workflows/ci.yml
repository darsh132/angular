name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend - .NET 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore backend/JiraClone.Api/JiraClone.Api.csproj
      - name: Build API
        run: dotnet build backend/JiraClone.Api/JiraClone.Api.csproj --no-restore --configuration Release
      - name: Restore tests
        run: dotnet restore backend/JiraClone.Api.Tests/JiraClone.Api.Tests.csproj
      - name: Test
        run: dotnet test backend/JiraClone.Api.Tests/JiraClone.Api.Tests.csproj --no-restore --configuration Release --logger "trx;LogFileName=backend-tests.trx"

  frontend:
    name: Frontend - Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --watch=false --no-progress
